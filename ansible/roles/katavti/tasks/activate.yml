---
- name: Render candidate Caddy route outside the imported glob
  ansible.builtin.template:
    src: katavti.caddy.j2
    dest: "{{ katavti_candidate_route }}"
    owner: root
    group: root
    mode: "0644"

- name: Detect another Caddy route claiming the Katavti hostname
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail && grep -RFl --include='*.caddy'
      --exclude='katavti.caddy' --exclude='.katavti.*.candidate'
      -- {{ katavti_domain_name | quote }}
      {{ katavti_shared_caddy_routes_dir | quote }}
    executable: /bin/bash
  register: katavti_conflicting_routes
  changed_when: false
  failed_when: katavti_conflicting_routes.rc not in [0, 1]

- name: Refuse to shadow another Caddy route
  ansible.builtin.assert:
    that: katavti_conflicting_routes.stdout_lines | length == 0
    fail_msg: >-
      Another Caddy fragment already claims {{ katavti_domain_name }}:
      {{ katavti_conflicting_routes.stdout_lines | join(', ') }}

- name: Inspect the previous Katavti route
  ansible.builtin.stat:
    path: "{{ katavti_caddy_route_path }}"
  register: katavti_previous_route_stat

- name: Switch traffic with validation and automatic rollback
  block:
    - name: Preserve previous Katavti route
      when: katavti_previous_route_stat.stat.exists
      ansible.builtin.copy:
        remote_src: true
        src: "{{ katavti_caddy_route_path }}"
        dest: "{{ katavti_previous_route }}"
        mode: preserve

    - name: Atomically install candidate Katavti route
      ansible.builtin.copy:
        remote_src: true
        src: "{{ katavti_candidate_route }}"
        dest: "{{ katavti_caddy_route_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Validate the complete shared Caddy configuration before reload
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ katavti_shared_caddy_project_dir }}"
          - exec
          - -T
          - "{{ katavti_shared_caddy_service }}"
          - caddy
          - validate
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
      changed_when: false
      # Safety contract marker: caddy validate

    - name: Gracefully reload shared Caddy
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ katavti_shared_caddy_project_dir }}"
          - exec
          - -T
          - "{{ katavti_shared_caddy_service }}"
          - caddy
          - reload
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
      changed_when: true

    - name: Verify public Katavti API after traffic switch
      ansible.builtin.uri:
        url: "https://{{ katavti_domain_name }}{{ katavti_api_base_path }}/health"
        status_code: 200
        validate_certs: true
      register: katavti_public_api_verify
      retries: "{{ katavti_health_retries }}"
      delay: "{{ katavti_health_delay }}"
      until: katavti_public_api_verify.status == 200

    - name: Verify public Katavti client after traffic switch
      ansible.builtin.uri:
        url: "https://{{ katavti_domain_name }}/"
        status_code: 200
        validate_certs: true

    - name: Record active slot only after successful verification
      ansible.builtin.copy:
        content: "{{ katavti_candidate_slot }}\n"
        dest: "{{ katavti_state_file }}"
        owner: root
        group: root
        mode: "0644"

  rescue:
    - name: Restore previous route after failed activation
      when: katavti_previous_route_stat.stat.exists
      ansible.builtin.copy:
        remote_src: true
        src: "{{ katavti_previous_route }}"
        dest: "{{ katavti_caddy_route_path }}"
        mode: preserve

    - name: Remove failed first-deployment route
      when: not katavti_previous_route_stat.stat.exists
      ansible.builtin.file:
        path: "{{ katavti_caddy_route_path }}"
        state: absent

    - name: Validate restored complete Caddy configuration
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ katavti_shared_caddy_project_dir }}"
          - exec
          - -T
          - "{{ katavti_shared_caddy_service }}"
          - caddy
          - validate
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
      changed_when: false

    - name: Gracefully reload restored Caddy configuration
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-directory
          - "{{ katavti_shared_caddy_project_dir }}"
          - exec
          - -T
          - "{{ katavti_shared_caddy_service }}"
          - caddy
          - reload
          - --config
          - /etc/caddy/Caddyfile
          - --adapter
          - caddyfile
      changed_when: true

    - name: Stop only the failed inactive Katavti slot
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "katavti-{{ katavti_candidate_slot }}"
          - --project-directory
          - "{{ katavti_candidate_dir }}"
          - stop
      changed_when: true

    - name: Report rolled-back activation failure
      ansible.builtin.fail:
        msg: >-
          Katavti activation failed and the prior Caddy route was restored;
          other applications were not modified.
