---
- name: Validate Katavti deployment configuration
  ansible.builtin.assert:
    that:
      - katavti_domain_name | length > 0
      - katavti_tls_email | length > 0
      - katavti_client_image | length > 0
      - katavti_server_image | length > 0
      - katavti_data_dir.startswith('/')
      - katavti_shared_caddy_routes_dir.startswith('/')
    fail_msg: >-
      Configure the hostname, TLS email, immutable images, data directory,
      and shared Caddy paths.

- name: Verify the existing shared proxy network without changing it
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ katavti_shared_network_name }}"]
  changed_when: false

- name: Read active deployment slot
  ansible.builtin.slurp:
    src: "{{ katavti_state_file }}"
  register: katavti_active_slot_file
  failed_when: false
  changed_when: false

- name: Select inactive deployment slot
  ansible.builtin.set_fact:
    katavti_active_slot: >-
      {{ (katavti_active_slot_file.content | default('') | b64decode | trim) or 'none' }}
    katavti_candidate_slot: >-
      {{ 'green' if (katavti_active_slot_file.content | default('') | b64decode | trim) == 'blue' else 'blue' }}

- name: Publish slot-specific deployment names
  ansible.builtin.set_fact:
    katavti_client_container_name: "katavti-{{ katavti_candidate_slot }}-client"
    katavti_server_container_name: "katavti-{{ katavti_candidate_slot }}-server"
    katavti_candidate_dir: "{{ katavti_releases_dir }}/{{ katavti_candidate_slot }}"
    katavti_candidate_route: "{{ katavti_staging_dir }}/katavti.{{ katavti_candidate_slot }}.candidate"
    katavti_previous_route: "{{ katavti_staging_dir }}/katavti.previous"

- name: Ensure Katavti system group exists
  ansible.builtin.group:
    name: "{{ katavti_system_user }}"
    gid: "{{ katavti_system_gid }}"
    system: true

- name: Ensure Katavti system user exists
  ansible.builtin.user:
    name: "{{ katavti_system_user }}"
    uid: "{{ katavti_system_uid }}"
    group: "{{ katavti_system_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Ensure Katavti directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ katavti_base_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ katavti_releases_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ katavti_candidate_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ katavti_config_dir }}", owner: root, group: root, mode: "0750"}
    - {path: "{{ katavti_staging_dir }}", owner: root, group: root, mode: "0750"}
    - path: "{{ katavti_data_dir }}"
      owner: "{{ katavti_system_user }}"
      group: "{{ katavti_system_user }}"
      mode: "0750"

- name: Render non-secret production configuration
  ansible.builtin.template:
    src: production.yaml.j2
    dest: "{{ katavti_config_dir }}/production.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Render production secrets
  ansible.builtin.template:
    src: secrets.yaml.j2
    dest: "{{ katavti_config_dir }}/secrets.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Render inactive slot Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ katavti_candidate_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start and wait for the inactive slot only
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --project-name
      - "katavti-{{ katavti_candidate_slot }}"
      - --project-directory
      - "{{ katavti_candidate_dir }}"
      - up
      - --detach
      - --pull
      - always
      - --wait
  changed_when: true

- name: Verify candidate API over the shared Docker network
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ katavti_shared_network_name }}"
      - curlimages/curl:8.16.0
      - --fail
      - --silent
      - --show-error
      - "http://{{ katavti_server_container_name }}:{{ katavti_server_port }}{{ katavti_api_base_path }}/health"
  changed_when: false
  register: katavti_candidate_api
  retries: "{{ katavti_health_retries }}"
  delay: "{{ katavti_health_delay }}"
  until: katavti_candidate_api.rc == 0

- name: Verify candidate client over the shared Docker network
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - "{{ katavti_shared_network_name }}"
      - curlimages/curl:8.16.0
      - --fail
      - --silent
      - --show-error
      - "http://{{ katavti_client_container_name }}:{{ katavti_client_port }}/"
  changed_when: false

- name: Activate verified candidate
  ansible.builtin.include_tasks: activate.yml
