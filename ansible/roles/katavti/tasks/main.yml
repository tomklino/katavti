---
- name: Refuse implicit Docker management on a shared host
  ansible.builtin.assert:
    that:
      - not (katavti_manage_docker | default(false) | bool)
    fail_msg: >-
      Docker management is intentionally unsupported on the shared host;
      provision it separately.

- name: Validate Katavti deployment configuration
  ansible.builtin.assert:
    that:
      - katavti_domain_name | length > 0
      - katavti_tls_email | length > 0
      - katavti_client_image | length > 0
      - katavti_server_image | length > 0
      - katavti_key_vault_name | length > 0
      - katavti_key_vault_managed_identity_client_id | length > 0
      - katavti_key_vault_google_client_id_secret | length > 0
      - not (katavti_smtp_enabled | bool) or katavti_key_vault_smtp_url_secret | length > 0
      - katavti_data_dir.startswith('/')
      - katavti_shared_caddy_routes_dir.startswith('/')
    fail_msg: >-
      Configure the hostname, TLS email, immutable images, data directory,
      and shared Caddy paths.

- name: Verify the existing shared proxy network without changing it
  ansible.builtin.command:
    argv: [docker, network, inspect, "{{ katavti_shared_network_name }}"]
  changed_when: false

- name: Read active deployment slot
  ansible.builtin.slurp:
    src: "{{ katavti_state_file }}"
  register: katavti_active_slot_file
  failed_when: false
  changed_when: false

- name: Select inactive deployment slot
  ansible.builtin.set_fact:
    katavti_active_slot: >-
      {{ (katavti_active_slot_file.content | default('') | b64decode | trim) or 'none' }}
    katavti_candidate_slot: >-
      {{ 'green' if (katavti_active_slot_file.content | default('') | b64decode | trim) == 'blue' else 'blue' }}

- name: Publish slot-specific deployment names
  ansible.builtin.set_fact:
    katavti_client_container_name: "katavti-{{ katavti_candidate_slot }}-client"
    katavti_server_container_name: "katavti-{{ katavti_candidate_slot }}-server"
    katavti_candidate_dir: "{{ katavti_releases_dir }}/{{ katavti_candidate_slot }}"
    katavti_candidate_route: "{{ katavti_staging_dir }}/katavti.{{ katavti_candidate_slot }}.candidate"
    katavti_previous_route: "{{ katavti_staging_dir }}/katavti.previous"
    katavti_previous_legacy_route: "{{ katavti_staging_dir }}/workspace-notes.previous"

- name: Ensure Katavti system group exists
  ansible.builtin.group:
    name: "{{ katavti_system_user }}"
    system: true

- name: Ensure Katavti system user exists
  ansible.builtin.user:
    name: "{{ katavti_system_user }}"
    group: "{{ katavti_system_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Read allocated Katavti user ID
  ansible.builtin.command: "id -u {{ katavti_system_user }}"
  register: katavti_system_uid_result
  changed_when: false

- name: Read allocated Katavti group ID
  ansible.builtin.command: "id -g {{ katavti_system_user }}"
  register: katavti_system_gid_result
  changed_when: false

- name: Publish allocated Katavti user and group IDs
  ansible.builtin.set_fact:
    katavti_system_uid: "{{ katavti_system_uid_result.stdout }}"
    katavti_system_gid: "{{ katavti_system_gid_result.stdout }}"

- name: Ensure Katavti directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ katavti_base_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ katavti_releases_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ katavti_candidate_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ katavti_config_dir }}", owner: root, group: "{{ katavti_system_user }}", mode: "0750"}
    - {path: "{{ katavti_staging_dir }}", owner: root, group: root, mode: "0750"}
    - path: "{{ katavti_data_dir }}"
      owner: "{{ katavti_system_user }}"
      group: "{{ katavti_system_user }}"
      mode: "0750"

- name: Inspect former Workspace Notes data
  when: katavti_migrate_legacy_data | bool
  ansible.builtin.stat:
    path: "{{ katavti_legacy_data_dir }}"
  register: katavti_legacy_data_stat

- name: Inspect legacy migration marker
  when: katavti_migrate_legacy_data | bool
  ansible.builtin.stat:
    path: "{{ katavti_legacy_migration_marker }}"
  register: katavti_legacy_migration_marker_stat

- name: Check whether Katavti data already contains files
  when:
    - katavti_migrate_legacy_data | bool
    - katavti_legacy_data_stat.stat.exists
    - not katavti_legacy_migration_marker_stat.stat.exists
  ansible.builtin.find:
    paths: "{{ katavti_data_dir }}"
    file_type: any
    hidden: true
    recurse: false
  register: katavti_existing_data

- name: Refuse to merge legacy data into non-empty Katavti data
  when:
    - katavti_migrate_legacy_data | bool
    - katavti_legacy_data_stat.stat.exists
    - not katavti_legacy_migration_marker_stat.stat.exists
  ansible.builtin.assert:
    that:
      - katavti_existing_data.matched == 0
    fail_msg: >-
      Katavti data already exists; refusing to merge it automatically with
      {{ katavti_legacy_data_dir }}.

- name: Copy compatible former Workspace Notes data once
  when:
    - katavti_migrate_legacy_data | bool
    - katavti_legacy_data_stat.stat.exists
    - not katavti_legacy_migration_marker_stat.stat.exists
  ansible.builtin.copy:
    remote_src: true
    src: "{{ katavti_legacy_data_dir }}/"
    dest: "{{ katavti_data_dir }}/"
    owner: "{{ katavti_system_user }}"
    group: "{{ katavti_system_user }}"
    mode: preserve

- name: Record completed legacy data migration
  when:
    - katavti_migrate_legacy_data | bool
    - katavti_legacy_data_stat.stat.exists
    - not katavti_legacy_migration_marker_stat.stat.exists
  ansible.builtin.copy:
    content: "{{ katavti_legacy_data_dir }}\n"
    dest: "{{ katavti_legacy_migration_marker }}"
    owner: root
    group: root
    mode: "0644"

- name: Render non-secret production configuration
  ansible.builtin.template:
    src: production.yaml.j2
    dest: "{{ katavti_config_dir }}/production.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Install Azure Key Vault secret fetcher
  ansible.builtin.template:
    src: fetch-key-vault-secrets.sh.j2
    dest: "{{ katavti_base_dir }}/fetch-key-vault-secrets"
    owner: root
    group: root
    mode: "0700"

- name: Fetch production secrets directly from Azure Key Vault
  ansible.builtin.command:
    argv:
      - "{{ katavti_base_dir }}/fetch-key-vault-secrets"
  changed_when: true
  no_log: true

- name: Render inactive slot Compose project
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ katavti_candidate_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0644"

- name: Start and verify the inactive slot
  block:
    - name: Start and wait for the inactive slot only
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "katavti-{{ katavti_candidate_slot }}"
          - --project-directory
          - "{{ katavti_candidate_dir }}"
          - up
          - --detach
          - --pull
          - always
          - --wait
      changed_when: true

    - name: Verify candidate API over the shared Docker network
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ katavti_shared_network_name }}"
          - curlimages/curl:8.16.0
          - --fail
          - --silent
          - --show-error
          - "http://{{ katavti_server_container_name }}:{{ katavti_server_port }}{{ katavti_api_base_path }}/health"
      changed_when: false
      register: katavti_candidate_api
      retries: "{{ katavti_health_retries }}"
      delay: "{{ katavti_health_delay }}"
      until: katavti_candidate_api.rc == 0

    - name: Verify candidate client over the shared Docker network
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --network
          - "{{ katavti_shared_network_name }}"
          - curlimages/curl:8.16.0
          - --fail
          - --silent
          - --show-error
          - "http://{{ katavti_client_container_name }}:{{ katavti_client_port }}/"
      changed_when: false

  rescue:
    - name: Stop failed candidate before activation
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --project-name
          - "katavti-{{ katavti_candidate_slot }}"
          - --project-directory
          - "{{ katavti_candidate_dir }}"
          - down
          - --remove-orphans
      changed_when: true
      failed_when: false

    - name: Report candidate verification failure
      ansible.builtin.fail:
        msg: Candidate startup or internal verification failed and was cleaned up.

- name: Activate verified candidate
  ansible.builtin.include_tasks: activate.yml
