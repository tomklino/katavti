---
- name: List Git release tags in version order
  ansible.builtin.command:
    argv: [git, -C, "{{ katavti_images_source_dir }}", tag, --sort=-version:refname]
  register: katavti_images_git_tags
  changed_when: false

- name: Require a release tag
  ansible.builtin.assert:
    that: katavti_images_git_tags.stdout_lines | length > 0
    fail_msg: Create a release tag before publishing or deploying immutable images.

- name: Select immutable image references
  ansible.builtin.set_fact:
    katavti_images_release_tag: "{{ katavti_images_git_tags.stdout_lines[0] }}"
    katavti_images_client_reference: >-
      {{ katavti_images_registry_namespace }}/katavti-client:{{ katavti_images_git_tags.stdout_lines[0] }}
    katavti_images_server_reference: >-
      {{ katavti_images_registry_namespace }}/katavti-server:{{ katavti_images_git_tags.stdout_lines[0] }}

- name: Read release tag at HEAD before building
  when: katavti_images_build_missing | bool
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ katavti_images_source_dir }}"
      - describe
      - --tags
      - --exact-match
      - HEAD
  register: katavti_images_head_tag
  changed_when: false
  failed_when: false

- name: Check working tree before building
  when: katavti_images_build_missing | bool
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ katavti_images_source_dir }}"
      - status
      - --porcelain
  register: katavti_images_worktree
  changed_when: false

- name: Require an exact clean release checkout before building
  when: katavti_images_build_missing | bool
  ansible.builtin.assert:
    that:
      - katavti_images_head_tag.rc == 0
      - katavti_images_head_tag.stdout == katavti_images_release_tag
      - katavti_images_worktree.stdout | length == 0
    fail_msg: >-
      Check out the latest release tag {{ katavti_images_release_tag }} with a
      clean working tree before building images.

- name: Validate client build secret source
  when: katavti_images_build_missing | bool
  ansible.builtin.assert:
    that:
      - katavti_images_key_vault_name | length > 0
      - katavti_images_google_client_id_secret | length > 0
    fail_msg: Configure the Azure Key Vault used for the Google client ID.

- name: Read Google client ID from Azure Key Vault for the client build
  when: katavti_images_build_missing | bool
  ansible.builtin.command:
    argv:
      - az
      - keyvault
      - secret
      - show
      - --vault-name
      - "{{ katavti_images_key_vault_name }}"
      - --name
      - "{{ katavti_images_google_client_id_secret }}"
      - --query
      - value
      - --output
      - tsv
  register: katavti_images_google_client_id_result
  changed_when: false
  no_log: true

- name: Check published release images
  ansible.builtin.command:
    argv: [docker, manifest, inspect, "{{ item }}"]
  loop:
    - "{{ katavti_images_client_reference }}"
    - "{{ katavti_images_server_reference }}"
  register: katavti_images_manifests
  changed_when: false
  failed_when: false

- name: Require images when deployment cannot build
  when:
    - not katavti_images_build_missing | bool
    - katavti_images_manifests.results | selectattr('rc', 'ne', 0) | list | length > 0
  ansible.builtin.fail:
    msg: One or more immutable images are missing; run playbooks/build-images.yml first.

- name: Build and publish missing client image
  when:
    - katavti_images_build_missing | bool
    - katavti_images_manifests.results[0].rc != 0
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - build
      - --platform
      - "{{ katavti_images_platform }}"
      - --build-arg
      - "VITE_GOOGLE_CLIENT_ID={{ katavti_images_google_client_id_result.stdout }}"
      - --tag
      - "{{ katavti_images_client_reference }}"
      - --push
      - "{{ katavti_images_source_dir }}/client"
  changed_when: true

- name: Build and publish missing server image
  when:
    - katavti_images_build_missing | bool
    - katavti_images_manifests.results[1].rc != 0
  ansible.builtin.command:
    argv:
      - docker
      - buildx
      - build
      - --platform
      - "{{ katavti_images_platform }}"
      - --file
      - "{{ katavti_images_source_dir }}/server/Dockerfile"
      - --tag
      - "{{ katavti_images_server_reference }}"
      - --push
      - "{{ katavti_images_source_dir }}"
  changed_when: true

- name: Validate public Docker Hub publication settings
  when:
    - katavti_images_build_missing | bool
    - katavti_images_publish_public | bool
  ansible.builtin.assert:
    that:
      - katavti_images_registry_namespace is match('^(?:docker\\.io/)?[a-z0-9][a-z0-9_-]*$')
    fail_msg: Automatic public repository configuration currently supports Docker Hub namespaces only.

- name: Read local Docker credentials for public repository configuration
  when:
    - katavti_images_build_missing | bool
    - katavti_images_publish_public | bool
  ansible.builtin.slurp:
    src: "{{ katavti_images_docker_config }}"
  register: katavti_images_docker_config_content
  no_log: true

- name: Publish Docker Hub repositories publicly
  when:
    - katavti_images_build_missing | bool
    - katavti_images_publish_public | bool
  ansible.builtin.uri:
    url: >-
      https://hub.docker.com/v2/repositories/{{ katavti_images_registry_namespace | regex_replace('^docker.io/', '') }}/{{ item }}/
    method: PATCH
    headers:
      Authorization: >-
        Bearer {{ ((katavti_images_docker_config_content.content | b64decode | from_json).auths['https://index.docker.io/v1/access-token'].auth | b64decode).split(':', 1)[1] }}
    body_format: json
    body:
      is_private: false
    status_code: 200
  loop:
    - katavti-client
    - katavti-server
  no_log: true
