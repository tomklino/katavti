---
# Copy this inventory outside the repository and replace every placeholder.
katavti_existing_host: ""
katavti_existing_user: azureuser
katavti_ssh_port: 22
katavti_azure_subscription_id: ""
katavti_azure_resource_group: ""
katavti_azure_location: ""
katavti_azure_vm_name: ""
katavti_azure_managed_identity_principal_id: ""
katavti_azure_storage_enabled: true
katavti_azure_storage_name: katavti-notes
# Globally unique, 3-24 lowercase letters/numbers; defaults from storage name.
katavti_azure_storage_account_name: "{{ katavti_azure_storage_name | lower | regex_replace('[^a-z0-9]', '') }}"
# Built-in Azure role: Storage Blob Data Contributor.
katavti_azure_storage_blob_contributor_role_id: 2a2b9908-6ea1-4ae2-8e65-a410df84e7d1
katavti_domain_name: katavti.klino.me
katavti_tls_email: admin@example.com
katavti_dns_enabled: true
katavti_dns_project: pasteblink-222512
katavti_dns_auth_kind: application
katavti_dns_managed_zone: klino-me
katavti_dns_managed_zone_dns_name: klino.me.
katavti_dns_credentials_file: ""
katavti_images_registry_namespace: docker.io/lutraman
katavti_images_platform: linux/amd64
katavti_images_key_vault_name: lutravault-pi-ai
katavti_images_google_client_id_secret: katavti-google-client-id
katavti_images_publish_public: true
katavti_key_vault_name: lutravault-pi-ai
katavti_key_vault_managed_identity_client_id: f06e546a-25b7-4367-807a-5a8663f84f6b
katavti_key_vault_google_client_id_secret: katavti-google-client-id
katavti_smtp_mode: disabled
katavti_key_vault_smtp_url_secret: katavti-smtp-url
katavti_key_vault_smtp_oauth_user_secret: katavti-smtp-oauth-user
katavti_key_vault_smtp_oauth_client_id_secret: katavti-smtp-oauth-client-id
katavti_key_vault_smtp_oauth_client_secret_secret: katavti-smtp-oauth-client-secret
katavti_key_vault_smtp_oauth_refresh_token_secret: katavti-smtp-oauth-refresh-token
katavti_mail_from: Katavti <no-reply@katavti.klino.me>
katavti_base_dir: /opt/katavti
katavti_data_dir: /var/lib/katavti/notes
katavti_shared_network_name: bifrost-stack_default
katavti_shared_caddy_project_dir: /opt/bifrost-stack
katavti_shared_caddy_routes_dir: /opt/bifrost-stack/caddy/caddy.d
katavti_shared_caddy_service: caddy
katavti_manage_docker: false
