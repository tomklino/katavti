---
- name: Select the existing Katavti deployment target
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require an explicitly configured target
      ansible.builtin.assert:
        that:
          - katavti_existing_host | default('') is match('^(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(?:\\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}$')
          - katavti_tls_email | default('') is match('^[^@ ]+@[^@ ]+\\.[^@ ]+$')
        fail_msg: >-
          Set katavti_existing_host to a numeric IP address and configure a
          valid TLS email in a private inventory; target discovery is disabled.

    - name: Read immutable Katavti image references
      ansible.builtin.include_role:
        name: katavti_images
      vars:
        katavti_images_build_missing: false

    - name: Validate Azure storage provisioning configuration
      when: katavti_azure_storage_enabled | bool
      ansible.builtin.assert:
        that:
          - katavti_azure_subscription_id | length > 0
          - katavti_azure_resource_group | length > 0
          - katavti_azure_location | length > 0
          - katavti_azure_vm_name | length > 0
          - katavti_azure_managed_identity_principal_id | length > 0
          - katavti_azure_storage_name | length > 0
          - katavti_azure_storage_account_name is match('^[a-z0-9]{3,24}$')
        fail_msg: Configure the Azure resource group, location, VM, managed identity principal ID, and storage names.

    - name: Read the Katavti Azure VM identity
      when: katavti_azure_storage_enabled | bool
      azure.azcollection.azure_rm_virtualmachine_info:
        resource_group: "{{ katavti_azure_resource_group }}"
        name: "{{ katavti_azure_vm_name }}"
      register: katavti_azure_vm

    - name: Require the configured managed identity to be assigned to the Katavti VM
      when: katavti_azure_storage_enabled | bool
      ansible.builtin.assert:
        that:
          - katavti_azure_vm.vms | length == 1
          - >-
            katavti_azure_managed_identity_principal_id == katavti_azure_vm.vms[0].identity.principal_id
            or katavti_azure_managed_identity_principal_id in
            (katavti_azure_vm.vms[0].identity.user_assigned_identities | default({}) |
            dict2items | map(attribute='value.principal_id') | list)
        fail_msg: The configured managed identity is not assigned to the Katavti VM.

    - name: Create the Azure notes storage account
      when: katavti_azure_storage_enabled | bool
      azure.azcollection.azure_rm_storageaccount:
        resource_group: "{{ katavti_azure_resource_group }}"
        name: "{{ katavti_azure_storage_account_name }}"
        location: "{{ katavti_azure_location }}"
        account_type: Standard_LRS
        kind: StorageV2
        https_only: true
        minimum_tls_version: TLS1_2
        state: present
      register: katavti_azure_storage_account

    - name: Create the Azure notes blob container
      when: katavti_azure_storage_enabled | bool
      azure.azcollection.azure_rm_storageblob:
        resource_group: "{{ katavti_azure_resource_group }}"
        storage_account_name: "{{ katavti_azure_storage_account_name }}"
        container: "{{ katavti_azure_storage_name }}"
        state: present

    - name: Grant the Katavti VM identity the Storage Blob Data Contributor role
      when: katavti_azure_storage_enabled | bool
      azure.azcollection.azure_rm_roleassignment:
        assignee_object_id: "{{ katavti_azure_managed_identity_principal_id }}"
        role_definition_id: "/subscriptions/{{ katavti_azure_subscription_id }}/providers/Microsoft.Authorization/roleDefinitions/{{ katavti_azure_storage_blob_contributor_role_id }}"
        scope: "{{ katavti_azure_storage_account.state.id }}"
        state: present

    - name: Add the explicitly selected target
      ansible.builtin.add_host:
        name: katavti_target
        groups: katavti_hosts
        ansible_host: "{{ katavti_existing_host }}"
        ansible_user: "{{ katavti_existing_user }}"
        ansible_port: "{{ katavti_ssh_port }}"
        katavti_client_image: "{{ katavti_images_client_reference }}"
        katavti_server_image: "{{ katavti_images_server_reference }}"
        katavti_azure_storage_enabled: "{{ katavti_azure_storage_enabled }}"
        katavti_azure_storage_name: "{{ katavti_azure_storage_name }}"
        katavti_azure_storage_account_name: "{{ katavti_azure_storage_account_name }}"

    - name: Verify Google Cloud DNS access without changing DNS
      when: katavti_dns_enabled | bool
      google.cloud.gcp_dns_managed_zone_info:
        project: "{{ katavti_dns_project }}"
        auth_kind: "{{ katavti_dns_auth_kind }}"
        service_account_file: "{{ katavti_dns_credentials_file | default(omit, true) }}"
        dns_name:
          - "{{ katavti_dns_managed_zone_dns_name }}"
      register: katavti_dns_zone_info

    - name: Require access to the configured Google Cloud DNS zone
      when: katavti_dns_enabled | bool
      ansible.builtin.assert:
        that:
          - katavti_dns_zone_info.resources | length > 0
        fail_msg: Cannot access the configured Google Cloud DNS zone.

    - name: Configure public DNS
      ansible.builtin.include_role:
        name: katavti_dns
      vars:
        katavti_dns_target: "{{ katavti_existing_host }}"

- name: Safely deploy Katavti beside existing applications
  hosts: katavti_hosts
  become: true
  gather_facts: true
  roles:
    - role: katavti
